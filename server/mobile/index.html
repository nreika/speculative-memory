<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Speculative Memory スマホ</title>
<style>
:root{--bg:#101114;--panel:#1b1d23;--line:#2c2f38;--fg:#eceef2;--dim:#9aa0ad;--acc:#7cc4ff;--warn:#ffb454;--ok:#6fdc8c;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(16,17,20,.96);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);margin-bottom:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:4px}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.tabs{display:flex}
.tab{flex:1;text-align:center;padding:10px 0;border:0;background:none;color:var(--dim);font-size:16px;border-bottom:3px solid transparent}
.tab.active{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav button,.btn{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.nav button:disabled{opacity:.35}
.nav .mid{flex:1;text-align:center;font-size:13px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.card .head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;font-size:14px}
.head .when{font-weight:700}.head .past{color:#ff9d7a}.head .future{color:var(--acc)}.head .now{color:var(--ok)}
.head .tag{color:var(--dim);font-size:12px}
.card img{display:block;width:100%;height:auto;background:#000;min-height:120px}
.card .text{padding:10px 12px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.card .text.empty{color:var(--dim)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.sum b{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.meta{font-size:12px;color:var(--dim);margin:0 0 12px}
.empty-note{color:var(--dim);text-align:center;padding:40px 0}
.busy{background:#2a2414;border:1px solid #5b4a1c;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;color:var(--warn)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.shoot{display:block;width:100%;text-align:center;background:var(--acc);color:#04202f;font-weight:700;border-radius:12px;padding:16px;font-size:18px}
.shoot input{display:none}
.preview{display:none;width:100%;border-radius:12px;margin:12px 0;background:#000}
fieldset{border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:10px 12px}
legend{color:var(--dim);font-size:13px;padding:0 6px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{flex:0 0 5.5em;font-size:14px;color:var(--dim)}
.row input[type=number],.row input[type=text],.row select{flex:1;min-width:0;background:#0d0e11;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
.row input[type=range]{flex:1}
.row .val{flex:0 0 3em;text-align:right;font-variant-numeric:tabular-nums}
.paid{color:var(--warn);font-size:12px}
.send{width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700;background:var(--ok);color:#062a12}
.send:disabled{opacity:.4}
.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0}
.job .big{font-size:18px;font-weight:700}
.bar{height:6px;background:#0d0e11;border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .8s linear}
#fs{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;touch-action:pan-y}
#fs.open{display:flex}
#fs .bar2{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#fff;font-size:14px}
#fs .bar2 button{background:#222;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px}
#fs .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fs img{max-width:100%;max-height:100%;object-fit:contain}
#fs .cap{padding:8px 14px calc(14px + env(safe-area-inset-bottom));color:#ddd;font-size:14px;max-height:30vh;overflow:auto}
</style>
</head>
<body>
<header>
  <div class="status" id="status">接続確認中…</div>
  <div class="tabs">
    <button class="tab active" data-tab="venue">会場</button>
    <button class="tab" data-tab="mine">自分</button>
  </div>
</header>
<main>
  <section id="venue">
    <div class="nav">
      <button id="vNewer" aria-label="新しい撮影">‹ 新しい</button>
      <div class="mid" id="vInfo">読み込み中…</div>
      <button id="vOlder" aria-label="古い撮影">古い ›</button>
    </div>
    <div id="vSum" class="sum" hidden></div>
    <div id="vBusy"></div>
    <div id="vBody"></div>
  </section>
  <section id="mine" hidden>
    <label class="shoot" id="shootLabel">📷 撮影する<input id="file" type="file" accept="image/*" capture="environment"></label>
    <img id="preview" class="preview" alt="">
    <fieldset>
      <legend>設定</legend>
      <div class="row"><label for="dA">距離 A</label><input id="dA" type="number" inputmode="numeric" value="30"><span>秒</span></div>
      <div class="row"><label for="dB">距離 B</label><input id="dB" type="number" inputmode="numeric" value="30"><span>秒</span></div>
      <div class="row"><label for="dC">距離 C</label><input id="dC" type="number" inputmode="numeric" value="-25"><span>秒</span></div>
      <div class="row"><label for="presence">presence</label><input id="presence" type="range" min="0" max="1" step="0.05" value="0.3"><span class="val" id="presenceV">0.30</span></div>
      <div class="row"><label for="tone">tone</label><input id="tone" type="range" min="0" max="1" step="0.05" value="0.3"><span class="val" id="toneV">0.30</span></div>
      <div class="row"><label for="extras">追加指示</label><input id="extras" type="text" maxlength="200" placeholder="例: 傘をさしている"></div>
      <div class="row"><label for="vlm">認識</label><select id="vlm"><option value="local">ローカル（無料）</option><option value="gemini">Gemini（有料）</option></select></div>
      <div class="row"><label for="img">画像生成</label><select id="img"><option value="local">ローカル（無料）</option><option value="gemini">Gemini（有料）</option></select></div>
      <div class="paid" id="paidNote" hidden>Gemini を選ぶと料金がかかります。</div>
    </fieldset>
    <button class="send" id="send" disabled>この写真で生成する</button>
    <div id="jobBox"></div>
    <div id="mineBody"></div>
    <p class="meta">自分の撮影は会場の表示には出ません。結果は約 24 時間で自動的に消えます。</p>
  </section>
</main>
<div id="fs">
  <div class="bar2"><button id="fsPrev">‹</button><span id="fsTitle"></span><button id="fsNext">›</button><button id="fsClose">閉じる</button></div>
  <div class="stage"><img id="fsImg" alt=""></div>
  <div class="cap" id="fsCap"></div>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var MINUS='−';
function fmtDist(s){s=Math.round(s);return (s<0?MINUS:'+')+Math.abs(s)+' 秒'}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function get(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var STAGE={setup:'準備',detect:'検出',plan:'計画',sceneA:'画像 A',sceneB:'画像 B',sceneC:'画像 C'};
function stageName(s){return s?(STAGE[s]||s):'準備'}
function fmtClock(iso){var d=new Date(iso);if(isNaN(d))return iso||'';var p=function(n){return String(n).padStart(2,'0')};return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}

/* 並び: 距離の符号で 過去 -> NOW -> 未来（距離の小さい順） */
function timeline(item){
  var rows=item.scenes.map(function(s){return {kind:'scene',dist:s.distanceSec,letter:s.letter,url:s.imageUrl,text:s.sceneText}});
  rows.push({kind:'now',dist:0,letter:'NOW',url:item.nowUrl,text:item.nowText});
  var order=function(r){return r.kind==='now'?0.0001:r.dist};
  rows.sort(function(a,b){return order(a)-order(b)});
  return rows;
}
function renderCard(row){
  var c=el('div','card');
  var h=el('div','head');
  var when=el('span','when '+(row.kind==='now'?'now':row.dist<0?'past':'future'));
  if(row.kind==='now')when.textContent='NOW（撮影した瞬間）';
  else when.textContent=fmtDist(row.dist)+(row.dist<0?'（過去）':'（未来）');
  h.appendChild(when);
  h.appendChild(el('span','tag',row.kind==='now'?'':row.letter));
  c.appendChild(h);
  if(row.url){var im=el('img');im.loading='eager';im.src=row.url;im.alt=row.letter;im.dataset.fs='1';c.appendChild(im)}
  var t=el('div','text'+(row.text?'':' empty'),row.text||(row.kind==='now'?'（状況記述なし）':'（文なし）'));
  c.appendChild(t);
  return c;
}
function metaLine(item){
  var b=function(x){return x==='gemini'?'Gemini':x==='local'?'ローカル':'?'};
  return fmtClock(item.capturedAt)+' ／ 認識 '+b(item.vlmBackend)+' ／ 生成 '+b(item.imageBackend);
}
function renderTimeline(box,item,openFs){
  var key=item?item.generationId:'';
  if(box.dataset.key===key&&box.firstChild)return; // same capture: keep the existing <img> elements
  box.dataset.key=key;
  box.textContent='';
  if(!item){box.appendChild(el('div','empty-note','まだ表示できる撮影がありません'));return}
  box.appendChild(el('p','meta',metaLine(item)));
  var rows=timeline(item);
  rows.forEach(function(r,i){var c=renderCard(r);c.addEventListener('click',function(e){if(e.target.dataset&&e.target.dataset.fs)openFs(item,rows,i)});box.appendChild(c)});
}

/* ---------- 稼働状況 ---------- */
var venueActive=null;
function refreshStatus(){
  Promise.all([get('/api/health').catch(function(){return null}),get('/api/mobile/status').catch(function(){return null})]).then(function(r){
    var h=r[0],s=r[1],box=$('status');box.textContent='';
    var d=function(ok,label){var sp=el('span');var dt=el('span','dot '+(ok?'on':'off'));sp.appendChild(dt);sp.appendChild(document.createTextNode(label));box.appendChild(sp)};
    if(!h&&!s){box.textContent='サーバーに接続できません';return}
    d(true,'サーバー');
    if(h){d(h.comfyui,'ComfyUI');d(h.ollama,'Ollama')}
    venueActive=s&&s.venue&&s.venue.active;
    if(venueActive){var a=venueActive;box.appendChild(el('span','','会場: 生成中 '+stageName(a.stage)+' '+Math.round(a.elapsedMs/1000)+' 秒'))}
    else box.appendChild(el('span','','会場: 待機中'));
    if(s&&s.mobile&&(s.mobile.queued||s.mobile.running))box.appendChild(el('span','','スマホ: 実行'+(s.mobile.running?'1':'0')+' / 待ち'+s.mobile.queued));
    renderVenueBusy();
  });
}
function renderVenueBusy(){
  var box=$('vBusy');box.textContent='';
  if(venueActive){var a=venueActive;box.appendChild(el('div','busy','会場の撮影を生成中です（'+stageName(a.stage)+'・'+Math.round(a.elapsedMs/1000)+' 秒・画像 '+a.deliveredCount+'/'+a.imageCount+'）。完了すると下に追加されます。'))}
}

/* ---------- 全画面 ---------- */
var fs={rows:null,i:0,items:null,ci:0,render:null};
function fsShow(){
  var r=fs.rows[fs.i];if(!r)return;
  $('fsImg').src=r.url||'';
  $('fsTitle').textContent=(r.kind==='now'?'NOW':fmtDist(r.dist)+' '+r.letter)+'  ('+(fs.i+1)+'/'+fs.rows.length+')';
  $('fsCap').textContent=r.text||'';
}
function openFs(item,rows,i){fs.onCapture=null;fs.rows=rows;fs.i=i;fs.item=item;$('fs').classList.add('open');fsShow()}
$('fsClose').onclick=function(){$('fs').classList.remove('open')};
$('fsPrev').onclick=function(){fs.i=(fs.i+fs.rows.length-1)%fs.rows.length;fsShow()};
$('fsNext').onclick=function(){fs.i=(fs.i+1)%fs.rows.length;fsShow()};
$('fsImg').onclick=function(){$('fs').classList.remove('open')};
/* スワイプ: 全画面中は前後の撮影へ（同じ位置の画像を出す） */
function onSwipe(node,cb){
  var x0=null,y0=null;
  node.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  node.addEventListener('touchend',function(e){
    if(x0==null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)cb(dx<0?1:-1);
  },{passive:true});
}
onSwipe($('fs'),function(dir){if(fs.onCapture)fs.onCapture(dir)});

/* ---------- 会場タブ ---------- */
var V={items:[],idx:0,pinned:null};
function showVenue(){
  var item=V.items[V.idx]||null;
  renderTimeline($('vBody'),item,function(it,rows,i){openFs(it,rows,i);fs.onCapture=function(dir){moveVenue(dir);var it2=V.items[V.idx];if(it2){fs.item=it2;fs.rows=timeline(it2);fs.i=Math.min(fs.i,fs.rows.length-1);fsShow()}}});
  $('vInfo').textContent=V.items.length?((V.idx+1)+' / '+V.items.length+(V.idx===0?'（最新）':'')):'撮影なし';
  $('vNewer').disabled=V.idx<=0;$('vOlder').disabled=V.idx>=V.items.length-1;
}
function moveVenue(d){ // d=+1: 古い方 / -1: 新しい方 （右スワイプで新しい方へ）
  var n=V.idx+d;if(n<0||n>=V.items.length)return;V.idx=n;V.pinned=V.items[n].generationId;if(n===0)V.pinned=null;showVenue();window.scrollTo(0,0);
}
$('vNewer').onclick=function(){moveVenue(-1)};
$('vOlder').onclick=function(){moveVenue(1)};
onSwipe($('venue'),function(dir){moveVenue(dir)});
function loadSummary(){
  get('/api/history-summary').then(function(r){
    var box=$('vSum'),t=(r&&r.summary||'').trim();
    box.textContent='';if(!t){box.hidden=true;return}
    box.appendChild(el('b','','これまで'));box.appendChild(document.createTextNode(t));box.hidden=false;
  }).catch(function(){});
}
function loadVenue(){
  loadSummary();
  get('/api/mobile/captures?source=venue&limit=20').then(function(r){
    var oldTop=V.items[0]&&V.items[0].generationId;
    V.items=r.items||[];
    if(V.pinned){var k=V.items.findIndex(function(x){return x.generationId===V.pinned});V.idx=k>=0?k:0;if(k<0)V.pinned=null}
    else V.idx=0;
    var newTop=V.items[0]&&V.items[0].generationId;
    if(oldTop!==newTop||!$('vBody').firstChild||V.pinned==null&&oldTop===newTop&&!$('vBody').firstChild)showVenue();
    else{$('vInfo').textContent=V.items.length?((V.idx+1)+' / '+V.items.length+(V.idx===0?'（最新）':'')):'撮影なし';$('vNewer').disabled=V.idx<=0;$('vOlder').disabled=V.idx>=V.items.length-1}
  }).catch(function(){$('vInfo').textContent='取得できません'});
}

/* ---------- 自分タブ ---------- */
var shot=null; // data URL
var jobs=[];try{jobs=JSON.parse(localStorage.getItem('smJobs')||'[]')}catch(e){}
function saveJobs(){try{localStorage.setItem('smJobs',JSON.stringify(jobs.slice(0,10)))}catch(e){}}
var polling=null;
function bindRange(id){var r=$(id),v=$(id+'V');var f=function(){v.textContent=Number(r.value).toFixed(2)};r.addEventListener('input',f);f()}
bindRange('presence');bindRange('tone');
function updPaid(){$('paidNote').hidden=!($('vlm').value==='gemini'||$('img').value==='gemini')}
$('vlm').onchange=updPaid;$('img').onchange=updPaid;

function shrink(file,maxSide){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,maxSide/Math.max(w,h));
      var cw=Math.round(w*k),ch=Math.round(h*k),cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      cv.getContext('2d').drawImage(im,0,0,cw,ch);URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg',0.9));
    };
    im.onerror=function(){URL.revokeObjectURL(url);reject(new Error('画像を読めません'))};
    im.src=url;
  });
}
$('file').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  shrink(f,1280).then(function(d){shot=d;var p=$('preview');p.src=d;p.style.display='block';$('send').disabled=false}).catch(function(e){alert(e.message)});
});
$('send').onclick=function(){
  if(!shot)return;
  var body={
    image:shot,imageCount:3,source:'mobile',
    sceneDistancesSec:[+$('dA').value||0,+$('dB').value||0,+$('dC').value||0],
    presence:+$('presence').value,tone:+$('tone').value,
    vlmBackend:$('vlm').value,imageBackend:$('img').value
  };
  var ex=$('extras').value.trim();if(ex)body.sceneExtras={gen_a:ex};
  if((body.vlmBackend==='gemini'||body.imageBackend==='gemini')&&!confirm('Gemini（有料）を使います。送信しますか？'))return;
  $('send').disabled=true;
  fetch('/api/mobile/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})})
    .then(function(j){jobs.unshift({id:j.jobId,at:Date.now()});saveJobs();shot=null;$('preview').style.display='none';$('file').value='';showJob(j.jobId)})
    .catch(function(e){alert('送信に失敗しました: '+e.message);$('send').disabled=!shot});
};
function showJob(id){
  clearInterval(polling);
  var box=$('jobBox'),body=$('mineBody');body.textContent='';
  var tick=function(){
    get('/api/mobile/job/'+encodeURIComponent(id)).then(function(j){
      box.textContent='';var c=el('div','job');
      if(j.state==='queued'){
        c.appendChild(el('div','big','順番待ち：あと '+j.ahead+' 件'));
        c.appendChild(el('div','meta','開始まで約 '+Math.ceil(j.etaStartSec/10)*10+' 秒、完了まで約 '+Math.ceil(j.etaDoneSec/10)*10+' 秒'+(j.waitingForVenue?'（会場の撮影が終わるのを待っています）':'')));
      }else if(j.state==='running'){
        c.appendChild(el('div','big','生成中：'+stageName(j.stage)+'（'+j.elapsedSec+' 秒）'));
        c.appendChild(el('div','meta','完了まで残り約 '+j.etaDoneSec+' 秒'));
        var b=el('div','bar'),i=el('i');i.style.width=Math.min(97,j.elapsedSec/(j.elapsedSec+j.etaDoneSec||1)*100)+'%';b.appendChild(i);c.appendChild(b);
      }else if(j.state==='completed'){
        c.appendChild(el('div','big ok','できました（'+j.elapsedSec+' 秒）'));
      }else{
        c.appendChild(el('div','big bad',j.state==='cancelled'?'取り消しました':'失敗しました'));
        if(j.error)c.appendChild(el('div','meta',j.error));
      }
      box.appendChild(c);
      if(j.state==='completed'){
        clearInterval(polling);$('send').disabled=!shot;
        get('/api/mobile/captures?source=mobile&captureId='+encodeURIComponent(id)+'&limit=1').then(function(r){renderTimeline(body,(r.items||[])[0],openFs.bind(null))});
      }else if(j.state==='failed'||j.state==='cancelled'){clearInterval(polling);$('send').disabled=!shot}
      else $('send').disabled=!shot;
    }).catch(function(){box.textContent='';box.appendChild(el('div','job','状態を取得できません（再試行中）'))});
  };
  tick();polling=setInterval(tick,2000);
}
function restoreMine(){
  if(!jobs.length){$('mineBody').appendChild(el('div','empty-note','撮影するとここに結果が出ます'));return}
  showJob(jobs[0].id);
}

/* ---------- タブ ---------- */
var tabs=document.querySelectorAll('.tab');
Array.prototype.forEach.call(tabs,function(t){t.onclick=function(){
  Array.prototype.forEach.call(tabs,function(x){x.classList.toggle('active',x===t)});
  $('venue').hidden=t.dataset.tab!=='venue';$('mine').hidden=t.dataset.tab!=='mine';
  try{localStorage.setItem('smTab',t.dataset.tab)}catch(e){}
  window.scrollTo(0,0);
}});
var saved=null;try{saved=localStorage.getItem('smTab')}catch(e){}
if(saved==='mine')document.querySelector('.tab[data-tab=mine]').click();

fs.onCapture=null;
refreshStatus();loadVenue();restoreMine();
setInterval(refreshStatus,3000);
setInterval(function(){if(!$('venue').hidden&&!$('fs').classList.contains('open'))loadVenue()},10000);
})();
</script>
</body>
</html>
